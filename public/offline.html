<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0F1115" />
  <title>Cadent — Offline</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0F1115;
      color: #F5F7FA;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .container {
      text-align: center;
      padding: 2rem 1.5rem;
      max-width: 360px;
      width: 100%;
    }

    .logo {
      display: inline-block;
      margin-bottom: 1.5rem;
    }

    .logo img {
      width: 48px;
      height: 48px;
      display: block;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #F5F7FA;
    }

    p {
      font-size: 0.9375rem;
      line-height: 1.5;
      color: #94A3B8;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      color: #0F1115;
      background: #22D3EE;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn:hover {
      background: #67E8F9;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:focus-visible {
      outline: 2px solid #22D3EE;
      outline-offset: 3px;
    }

    .brand {
      margin-top: 2.5rem;
      font-size: 0.75rem;
      color: #475569;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="/cadent-logo-sm.png" alt="Cadent" width="48" height="48" />
    </div>
    <h1>You're offline</h1>
    <p>Connect to the internet and try again to continue tracking your practice.</p>
    <button class="btn" onclick="window.location.reload()" type="button">Try again</button>
    <div class="brand">Cadent</div>
  </div>
</body>
</html>
